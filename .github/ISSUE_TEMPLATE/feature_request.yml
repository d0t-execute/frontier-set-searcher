name: Feature request
description: Suggest an idea or improvement for the searcher
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The build/search scenario this would help with, not just the feature itself.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your idea for how this could work. Rough is fine.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, screenshots, or examples from other set-builder tools, if relevant.
    validations:
      required: false
